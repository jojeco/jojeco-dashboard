
server {

    listen 80;

    server_name _;

    root /usr/share/nginx/html;

    index index.html;

    gzip on;

    gzip_vary on;

    gzip_min_length 1024;

    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;

    add_header X-Content-Type-Options "nosniff" always;

    add_header X-XSS-Protection "1; mode=block" always;



    # Re-resolve upstream on every request (Docker bridge IP changes on recreate)
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://jojeco-dashboard-api:3001;

    location /api/ {

        proxy_pass $api_upstream;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE keepalive
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;

    }



    # Static assets with long cache

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {

        expires 1y;

        add_header Cache-Control "public, immutable";

    }



    # Birthday photos folder

    location /birthday/ {

        try_files $uri /index.html;

    }

    # Minecraft resource packs (public, no auth required)
    location /mc-packs/ {
        alias /mc-packs/;
        add_header Access-Control-Allow-Origin "*";
        add_header Content-Disposition "attachment";
    }



    # SPA routing — no-store prevents Cloudflare from caching index.html

    location / {

        try_files $uri /index.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

    }



    location = /health {

        access_log off;

        return 200 "healthy\n";

        add_header Content-Type text/plain;

    }

}

